name: build-dsh-tauri-remote
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install (only remote + its workspace deps)
        run: pnpm install --filter "dsh-tauri-remote..." --ignore-scripts
      - name: build
        run: pnpm --filter dsh-tauri-remote build
      - name: pack (resolve every spec to the installed version)
        run: |
          cd packages/dsh-tauri-remote
          node -e '
          const fs = require("fs");
          const path = require("path");
          const f = "package.json";
          const p = JSON.parse(fs.readFileSync(f, "utf8"));
          const resolved = {};
          for (const key of ["dependencies", "peerDependencies"]) {
            if (!p[key]) continue;
            for (const dep of Object.keys(p[key])) {
              if (!/^(catalog:|workspace:)/.test(String(p[key][dep]))) continue;
              let v = null;
              for (const base of ["node_modules", "../../node_modules"]) {
                try {
                  v = JSON.parse(fs.readFileSync(path.join(base, dep, "package.json"), "utf8")).version;
                  break;
                } catch {}
              }
              if (v) { p[key][dep] = "^" + v; resolved[dep] = p[key][dep]; }
            }
          }
          console.log("resolved:", JSON.stringify(resolved));
          const left = [];
          for (const key of ["dependencies", "peerDependencies", "devDependencies"]) {
            if (!p[key]) continue;
            for (const dep of Object.keys(p[key])) {
              if (/^(catalog:|workspace:)/.test(String(p[key][dep]))) left.push(key + "/" + dep + "=" + p[key][dep]);
            }
          }
          if (left.length) { console.error("UNRESOLVED:", left.join(", ")); process.exit(1); }
          delete p.devDependencies;
          delete p.scripts;
          fs.writeFileSync(f, JSON.stringify(p, null, 2));
          console.log("packed", p.name, p.version);
          '
          ls -la dist | head -20
          mkdir -p out
          cp -r dist cordis.patch.yml package.json out/
          tar czf "$GITHUB_WORKSPACE/dsh-tauri-remote.tgz" -C out .
          ls -la "$GITHUB_WORKSPACE/dsh-tauri-remote.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-remote
          path: dsh-tauri-remote.tgz
          if-no-files-found: error
