name: build-dsh-tauri-remote
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install
        run: pnpm install --filter "dsh-tauri-remote..." --ignore-scripts
      - name: build (remote + its workspace deps)
        run: pnpm -r --filter "dsh-tauri-remote..." run build
      - name: pack all three with resolved specs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          for pkg in dsh-tauri dsh-tauri-ui dsh-tauri-remote; do
            echo "=== $pkg ==="
            cd "$GITHUB_WORKSPACE/packages/$pkg"
            node -e '
            const fs = require("fs"), path = require("path");
            const f = "package.json";
            const p = JSON.parse(fs.readFileSync(f, "utf8"));
            const resolved = {};
            for (const key of ["dependencies", "peerDependencies"]) {
              if (!p[key]) continue;
              for (const dep of Object.keys(p[key])) {
                const spec = String(p[key][dep]);
                if (!/^(catalog:|workspace:)/.test(spec)) continue;
                let v = null;
                for (const base of ["node_modules", "../../node_modules"]) {
                  try { v = JSON.parse(fs.readFileSync(path.join(base, dep, "package.json"), "utf8")).version; break; } catch {}
                }
                if (!v) { console.error("MISSING " + dep); process.exit(1); }
                p[key][dep] = "^" + v;
                resolved[dep] = p[key][dep];
              }
            }
            for (const key of ["dependencies", "peerDependencies"]) {
              if (!p[key]) continue;
              for (const dep of Object.keys(p[key])) {
                if (/^(catalog:|workspace:)/.test(String(p[key][dep]))) { console.error("UNRESOLVED " + key + "/" + dep); process.exit(1); }
              }
            }
            delete p.devDependencies;
            delete p.scripts;
            fs.writeFileSync(f, JSON.stringify(p, null, 2));
            console.log("  " + p.name + "@" + p.version + " deps=" + JSON.stringify(resolved));
            '
            rm -rf /tmp/pack && mkdir -p /tmp/pack
            for item in dist cordis.patch.yml package.json; do
              [ -e "$item" ] && cp -r "$item" /tmp/pack/
            done
            tar czf "$GITHUB_WORKSPACE/out/$pkg.tgz" -C /tmp/pack .
            ls -la "$GITHUB_WORKSPACE/out/$pkg.tgz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-set
          path: out/*.tgz
          if-no-files-found: error
